global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: marketdata
    static_configs:
      - targets: ["marketdata:8081"]
  - job_name: risk
    static_configs:
      - targets: ["risk:8082"]
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]
